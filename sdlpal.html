<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>仙剑奇侠传 Web</title>
    <link rel="icon" href="icon.png" type="image/png">
    <style>
      :root {
        color-scheme: dark;
        --gold: #f6d878;
        --gold2: #a66b2e;
        --red: #8e1d22;
        --panel: rgba(18, 11, 10, .86);
      }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 18%, rgba(151, 45, 36, .45), transparent 34%),
          radial-gradient(circle at 50% 100%, rgba(246, 216, 120, .13), transparent 34%),
          linear-gradient(180deg, #0b0505 0%, #1b0a08 48%, #050303 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif;
      }
      #gameFrame {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #000;
      }
      canvas.emscripten {
        display: block;
        width: min(100vw, calc(100vh * 1.6));
        height: min(100vh, calc(100vw / 1.6));
        image-rendering: pixelated;
        background: #000;
        outline: none;
      }
      #loadingScreen {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 50% 18%, rgba(196, 60, 43, .36), transparent 32%),
          radial-gradient(circle at 50% 88%, rgba(246, 216, 120, .11), transparent 38%),
          rgba(8, 4, 4, .94);
        transition: opacity .45s ease, visibility .45s ease;
      }
      #loadingScreen.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .loading-card {
        width: min(560px, calc(100vw - 40px));
        box-sizing: border-box;
        padding: 34px 30px 30px;
        border: 1px solid rgba(246, 216, 120, .45);
        border-radius: 22px;
        background: linear-gradient(180deg, rgba(50, 21, 17, .92), var(--panel));
        box-shadow: 0 28px 90px rgba(0,0,0,.65), inset 0 0 60px rgba(246,216,120,.04);
        text-align: center;
      }
      #logo {
        width: 86px;
        height: 86px;
        object-fit: contain;
        margin-bottom: 10px;
        filter: drop-shadow(0 8px 20px rgba(0,0,0,.55));
      }
      h1 {
        margin: 0;
        color: var(--gold);
        font-size: clamp(34px, 7vw, 56px);
        line-height: 1.08;
        letter-spacing: .08em;
        text-shadow: 0 3px 0 rgba(0,0,0,.45), 0 0 22px rgba(246,216,120,.25);
      }
      .subtitle {
        margin: 10px 0 24px;
        color: rgba(255, 238, 190, .72);
        letter-spacing: .18em;
        text-transform: uppercase;
        font-size: 13px;
      }
      #buildVersion {
        margin: -12px 0 22px;
        color: rgba(246, 216, 120, .72);
        font-size: 12px;
        letter-spacing: .08em;
        user-select: text;
      }
      .spinner {
        width: 42px;
        height: 42px;
        margin: 0 auto 18px;
        border: 3px solid rgba(246,216,120,.18);
        border-top-color: var(--gold);
        border-radius: 50%;
        animation: rotation .85s linear infinite;
      }
      @keyframes rotation { from { transform: rotate(0); } to { transform: rotate(360deg); } }
      #status {
        min-height: 24px;
        color: #fff1c2;
        font-weight: 700;
        font-size: 15px;
      }
      #progress {
        appearance: none;
        width: 100%;
        height: 12px;
        margin-top: 18px;
        border: 0;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255,255,255,.12);
      }
      #progress::-webkit-progress-bar { background: rgba(255,255,255,.12); }
      #progress::-webkit-progress-value {
        border-radius: 999px;
        background: linear-gradient(90deg, var(--red), var(--gold));
      }
      #progress::-moz-progress-bar {
        border-radius: 999px;
        background: linear-gradient(90deg, var(--red), var(--gold));
      }
      #tips {
        margin-top: 18px;
        color: rgba(255,255,255,.56);
        font-size: 13px;
        line-height: 1.55;
      }
      #utilityBar {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 1001;
        display: flex;
        gap: 8px;
      }
      #utilityBar button {
        border: 1px solid rgba(246,216,120,.35);
        border-radius: 999px;
        background: rgba(0,0,0,.42);
        color: #ffeec1;
        padding: 8px 12px;
        font-size: 13px;
        backdrop-filter: blur(8px);
      }
      #utilityBar button:hover { background: rgba(142,29,34,.72); }
      #btnStartGame {
        display: none;
        margin-top: 22px;
        border: 1px solid rgba(246,216,120,.72);
        border-radius: 999px;
        padding: 12px 42px;
        background: linear-gradient(180deg, #b9252d, #681116);
        color: #fff0c8;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: .12em;
        box-shadow: 0 12px 32px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.22);
        cursor: pointer;
      }
      #btnStartGame:hover { filter: brightness(1.12); }
      #btnStartGame:active { transform: translateY(1px); }

      #mobileControls {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 998;
        pointer-events: none;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }
      .vc-pad, .vc-actions, .vc-battle {
        pointer-events: auto;
      }
      .vc-btn {
        width: 54px;
        height: 54px;
        border-radius: 16px;
        border: 1px solid rgba(246,216,120,.45);
        background: rgba(20, 8, 8, .48);
        color: #ffeab4;
        font-weight: 800;
        font-size: 20px;
        box-shadow: 0 8px 22px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.15);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      .vc-btn:active, .vc-btn.pressed {
        background: rgba(150, 28, 32, .78);
        transform: translateY(1px) scale(.98);
      }
      .vc-pad {
        position: fixed;
        left: max(16px, env(safe-area-inset-left));
        bottom: max(18px, env(safe-area-inset-bottom));
        display: grid;
        grid-template-columns: repeat(3, 54px);
        grid-template-rows: repeat(3, 54px);
        gap: 8px;
      }
      .vc-pad [data-key="ArrowUp"] { grid-column: 2; grid-row: 1; }
      .vc-pad [data-key="ArrowLeft"] { grid-column: 1; grid-row: 2; }
      .vc-pad [data-key="ArrowRight"] { grid-column: 3; grid-row: 2; }
      .vc-pad [data-key="ArrowDown"] { grid-column: 2; grid-row: 3; }
      .vc-actions {
        position: fixed;
        right: max(16px, env(safe-area-inset-right));
        bottom: max(18px, env(safe-area-inset-bottom));
        display: grid;
        grid-template-columns: repeat(2, 64px);
        gap: 10px;
        align-items: end;
      }
      .vc-actions .vc-btn { width: 64px; height: 54px; font-size: 15px; }
      .vc-battle {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: max(18px, env(safe-area-inset-bottom));
        display: none;
        grid-template-columns: repeat(4, 54px);
        gap: 8px;
      }
      .vc-battle .vc-btn { width: 54px; height: 42px; font-size: 13px; border-radius: 12px; }
      #mobileControls.battle-active .vc-battle { display: grid; }
      @media (pointer: coarse), (max-width: 820px) {
        #mobileControls.active { display: block; }
        #utilityBar { display: none; }
      }
      @media (max-height: 430px) and (orientation: landscape) {
        .vc-btn { width: 48px; height: 48px; border-radius: 14px; }
        .vc-pad { grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(3, 48px); gap: 6px; }
        .vc-actions { grid-template-columns: repeat(2, 58px); gap: 8px; }
        .vc-actions .vc-btn { width: 58px; height: 48px; font-size: 14px; }
        .vc-battle { top: max(10px, env(safe-area-inset-top)); bottom: auto; }
        .vc-battle .vc-btn { width: 50px; height: 36px; font-size: 12px; }
      }
    </style>
  </head>
  <body>
    <div id="gameFrame">
      <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    </div>

    <div id="utilityBar">
      <button id="btnDeleteData" onclick="clearData();">清除缓存</button>
      <button id="btnDownloadSave" onclick="downloadSaves();">下载存档</button>
    </div>



    <div id="mobileControls" aria-label="虚拟按键">
      <div class="vc-pad">
        <button class="vc-btn" data-key="ArrowUp">▲</button>
        <button class="vc-btn" data-key="ArrowLeft">◀</button>
        <button class="vc-btn" data-key="ArrowRight">▶</button>
        <button class="vc-btn" data-key="ArrowDown">▼</button>
      </div>
      <div class="vc-actions">
        <button class="vc-btn" data-key="Enter">回车</button>
        <button class="vc-btn" data-key=" ">空格</button>
        <button class="vc-btn" data-key="Escape">ESC</button>
      </div>
      <div class="vc-battle">
        <button class="vc-btn" data-key="r">重复</button>
        <button class="vc-btn" data-key="a">自动</button>
        <button class="vc-btn" data-key="d">防御</button>
        <button class="vc-btn" data-key="e">物品</button>
        <button class="vc-btn" data-key="w">投掷</button>
        <button class="vc-btn" data-key="q">逃跑</button>
        <button class="vc-btn" data-key="f">强制</button>
        <button class="vc-btn" data-key="s">状态</button>
      </div>
    </div>

    <div id="loadingScreen">
      <div class="loading-card">
        <img id="logo" src="icon.png" alt="SDLPAL">
        <h1>仙剑奇侠传</h1>
        <div class="subtitle">SDLPAL Web Edition</div>
        <div id="buildVersion">版本 20260608.23</div>
        <div class="spinner" id="spinner"></div>
        <div id="status">正在初始化...</div>
        <progress value="0" max="100" id="progress" hidden></progress>
        <button id="btnStartGame" onclick="launch();">开始游戏</button>
        <div id="tips">首次进入会自动下载游戏资源。准备完成后点击“开始游戏”，片头可按任意键跳过。</div>
      </div>
    </div>

    <script type="text/javascript" src="jszip.min.js"></script>
    <script type="text/javascript" src="main.js?v=20260608.23"></script>
    <script type="text/javascript" src="sdlpal.js?v=20260608.23"></script>

    <script type="text/javascript">
      var userLang = navigator.language || navigator.userLanguage;
      if (userLang === 'zh-TW' || userLang.startsWith('zh-Hant')) {
        document.getElementById('btnDeleteData').textContent = '清除快取';
        document.getElementById('btnDownloadSave').textContent = '下載記錄';
        document.getElementById('btnStartGame').textContent = '開始遊戲';
        document.getElementById('tips').textContent = '首次進入會自動下載遊戲資源。準備完成後點擊「開始遊戲」，片頭可按任意鍵跳過。';
      } else if (!(userLang === 'zh-CN' || userLang.startsWith('zh-Hans'))) {
        document.getElementById('btnDeleteData').textContent = 'Clear cache';
        document.getElementById('btnDownloadSave').textContent = 'Download saves';
        document.getElementById('btnStartGame').textContent = 'Start Game';
        document.getElementById('tips').textContent = 'Game files download automatically on first launch. Click Start Game when ready. Press any key to skip intro videos.';
      }
    </script>
  </body>
</html>
