<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>真·仙剑奇侠传 20260610.9</title>
    <link rel="icon" href="icon.png" type="image/png">
    <style>
      :root {
        color-scheme: dark;
        --gold: #f6d878;
        --gold2: #a66b2e;
        --red: #8e1d22;
        --panel: rgba(18, 11, 10, .86);
      }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 18%, rgba(151, 45, 36, .45), transparent 34%),
          radial-gradient(circle at 50% 100%, rgba(246, 216, 120, .13), transparent 34%),
          linear-gradient(180deg, #0b0505 0%, #1b0a08 48%, #050303 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif;
      }
      #gameFrame {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #000;
      }
      canvas.emscripten {
        display: block;
        width: min(100vw, calc(100vh * 1.6));
        height: min(100vh, calc(100vw / 1.6));
        image-rendering: pixelated;
        background: #000;
        outline: none;
      }
      #loadingScreen {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 50% 18%, rgba(196, 60, 43, .36), transparent 32%),
          radial-gradient(circle at 50% 88%, rgba(246, 216, 120, .11), transparent 38%),
          rgba(8, 4, 4, .94);
        transition: opacity .45s ease, visibility .45s ease;
      }
      #loadingScreen.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .loading-card {
        width: min(560px, calc(100vw - 40px));
        box-sizing: border-box;
        padding: 34px 30px 30px;
        border: 1px solid rgba(246, 216, 120, .45);
        border-radius: 22px;
        background: linear-gradient(180deg, rgba(50, 21, 17, .92), var(--panel));
        box-shadow: 0 28px 90px rgba(0,0,0,.65), inset 0 0 60px rgba(246,216,120,.04);
        text-align: center;
      }
      #logo {
        width: 86px;
        height: 86px;
        object-fit: contain;
        margin-bottom: 10px;
        filter: drop-shadow(0 8px 20px rgba(0,0,0,.55));
      }
      h1 {
        margin: 0;
        color: var(--gold);
        font-size: clamp(34px, 7vw, 56px);
        line-height: 1.08;
        letter-spacing: .08em;
        text-shadow: 0 3px 0 rgba(0,0,0,.45), 0 0 22px rgba(246,216,120,.25);
      }
      .subtitle {
        margin: 10px 0 24px;
        color: rgba(255, 238, 190, .72);
        letter-spacing: .18em;
        text-transform: uppercase;
        font-size: 13px;
      }
      #buildVersion {
        margin: -12px 0 22px;
        color: rgba(246, 216, 120, .72);
        font-size: 12px;
        letter-spacing: .08em;
        user-select: text;
      }

      .tuning-panel {
        margin: -8px auto 18px;
        display: grid;
        gap: 12px;
        color: #ffe8a8;
        font-size: 14px;
        font-weight: 700;
      }
      .tuning-setting {
        display: grid;
        grid-template-columns: 6em minmax(160px, 1fr) 3.6em;
        align-items: center;
        gap: 10px;
        text-align: left;
      }
      .tuning-setting input[type="range"] {
        appearance: none;
        -webkit-appearance: none;
        height: 22px;
        border-radius: 999px;
        border: 1px solid rgba(246, 216, 120, .42);
        background: linear-gradient(90deg, rgba(185,37,45,.85), rgba(246,216,120,.34));
        box-shadow: inset 0 1px 4px rgba(0,0,0,.45);
      }
      .tuning-setting input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 2px solid rgba(255, 239, 191, .95);
        background: radial-gradient(circle at 35% 30%, #fff7d2, #d8a832 62%, #6b3210);
        box-shadow: 0 4px 12px rgba(0,0,0,.55);
      }
      .tuning-value {
        color: var(--gold);
        font-size: 16px;
        font-weight: 900;
        text-align: right;
        white-space: nowrap;
      }
      .spinner {
        width: 42px;
        height: 42px;
        margin: 0 auto 18px;
        border: 3px solid rgba(246,216,120,.18);
        border-top-color: var(--gold);
        border-radius: 50%;
        animation: rotation .85s linear infinite;
      }
      @keyframes rotation { from { transform: rotate(0); } to { transform: rotate(360deg); } }
      #status {
        min-height: 24px;
        color: #fff1c2;
        font-weight: 700;
        font-size: 15px;
      }
      #progress {
        appearance: none;
        width: 100%;
        height: 12px;
        margin-top: 18px;
        border: 0;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255,255,255,.12);
      }
      #progress::-webkit-progress-bar { background: rgba(255,255,255,.12); }
      #progress::-webkit-progress-value {
        border-radius: 999px;
        background: linear-gradient(90deg, var(--red), var(--gold));
      }
      #progress::-moz-progress-bar {
        border-radius: 999px;
        background: linear-gradient(90deg, var(--red), var(--gold));
      }
      #tips {
        margin-top: 18px;
        color: rgba(255,255,255,.56);
        font-size: 13px;
        line-height: 1.55;
      }
      #utilityBar {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 1001;
        display: flex;
        gap: 8px;
      }
      #utilityBar button {
        border: 1px solid rgba(246,216,120,.35);
        border-radius: 999px;
        background: rgba(0,0,0,.42);
        color: #ffeec1;
        padding: 8px 12px;
        font-size: 13px;
        backdrop-filter: blur(8px);
      }
      #utilityBar button:hover { background: rgba(142,29,34,.72); }
      #audioControls {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        right: max(12px, env(safe-area-inset-right));
        z-index: 1102;
        display: flex;
        gap: 14px;
        pointer-events: auto;
      }
      .audio-toggle {
        width: 42px;
        height: 42px;
        border: 1px solid rgba(246,216,120,.45);
        border-radius: 999px;
        background: rgba(0,0,0,.46);
        color: #ffeec1;
        font-size: 20px;
        line-height: 1;
        box-shadow: 0 8px 22px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.12);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      .audio-toggle.off {
        background: rgba(142,29,34,.82);
        color: #fff;
      }
      .audio-toggle:active { transform: translateY(1px) scale(.98); }
      #btnStartGame {
        display: none;
        margin-top: 22px;
        border: 1px solid rgba(246,216,120,.72);
        border-radius: 999px;
        padding: 12px 42px;
        background: linear-gradient(180deg, #b9252d, #681116);
        color: #fff0c8;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: .12em;
        box-shadow: 0 12px 32px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.22);
        cursor: pointer;
      }
      #btnStartGame:hover { filter: brightness(1.12); }
      #btnStartGame:active { transform: translateY(1px); }

      #mobileControls {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 998;
        pointer-events: none;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }
      .vc-pad, .vc-actions, .vc-battle {
        pointer-events: auto;
      }
      .vc-party-switch { display: none; }
      #mobileControls.party-switch-active:not(.battle-active) .vc-party-switch { display: inline-block; }
      .vc-btn {
        width: 54px;
        height: 54px;
        border-radius: 999px;
        border: 1px solid rgba(246,216,120,.45);
        background: radial-gradient(circle at 35% 28%, rgba(255,244,198,.16), rgba(20,8,8,.56));
        color: #ffeab4;
        font-weight: 900;
        font-size: 20px;
        box-shadow: 0 8px 22px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.15);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      .vc-btn:active, .vc-btn.pressed {
        background: radial-gradient(circle at 35% 28%, rgba(255,242,182,.42), rgba(150,28,32,.82));
        transform: translateY(1px) scale(.96);
      }
      .vc-pad {
        position: fixed;
        left: max(16px, env(safe-area-inset-left));
        bottom: max(18px, env(safe-area-inset-bottom));
        width: 186px;
        height: 186px;
        border-radius: 50%;
        border: 1px solid rgba(246,216,120,.26);
        background:
          radial-gradient(circle at 50% 50%, rgba(255,236,174,.18) 0 17%, transparent 18%),
          conic-gradient(from -22.5deg, rgba(246,216,120,.08), rgba(246,216,120,.20), rgba(246,216,120,.08), rgba(246,216,120,.20), rgba(246,216,120,.08));
        box-shadow: inset 0 0 34px rgba(246,216,120,.10), 0 10px 28px rgba(0,0,0,.35);
        touch-action: none;
      }
      .vc-pad::before {
        content: '';
        position: absolute;
        inset: 28px;
        border-radius: 50%;
        border: 1px dashed rgba(246,216,120,.20);
      }
      .vc-joy-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 48px;
        height: 48px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        border: 2px solid rgba(255,239,191,.70);
        background: radial-gradient(circle at 35% 30%, rgba(255,246,210,.35), rgba(96,36,28,.66));
        box-shadow: 0 8px 22px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.25);
        pointer-events: none;
      }
      .vc-dir {
        position: absolute;
        width: 36px;
        height: 36px;
        line-height: 36px;
        margin-left: -18px;
        margin-top: -18px;
        border-radius: 50%;
        color: rgba(255,234,180,.92);
        font-size: 22px;
        font-weight: 900;
        text-align: center;
        text-shadow: 0 2px 6px rgba(0,0,0,.75);
        pointer-events: none;
      }
      .vc-dir.active {
        color: #fff8d0;
        background: rgba(150,28,32,.62);
        box-shadow: 0 0 18px rgba(246,216,120,.32);
      }
      .vc-dir-nw { left: 27%; top: 27%; }
      .vc-dir-n  { left: 50%; top: 14%; }
      .vc-dir-ne { left: 73%; top: 27%; }
      .vc-dir-w  { left: 14%; top: 50%; }
      .vc-dir-e  { left: 86%; top: 50%; }
      .vc-dir-sw { left: 27%; top: 73%; }
      .vc-dir-s  { left: 50%; top: 86%; }
      .vc-dir-se { left: 73%; top: 73%; }
      .vc-actions {
        position: fixed;
        right: max(16px, env(safe-area-inset-right));
        bottom: max(18px, env(safe-area-inset-bottom));
        display: grid;
        grid-template-columns: repeat(2, 64px);
        gap: 10px;
        align-items: end;
      }
      .vc-actions .vc-btn { width: 64px; height: 54px; font-size: 15px; }
      .vc-battle {
        position: fixed;
        right: max(14px, env(safe-area-inset-right));
        bottom: calc(max(18px, env(safe-area-inset-bottom)) + 156px);
        display: none;
        grid-template-columns: repeat(5, 48px);
        gap: 6px;
        z-index: 26;
      }
      .vc-battle .vc-btn { width: 48px; height: 36px; font-size: 12px; border-radius: 10px; }
      #mobileControls.battle-active .vc-battle { display: grid; }
      @media (pointer: coarse), (max-width: 820px) {
        #mobileControls.active { display: block; }
        #utilityBar { display: none; }
      }
      @media (max-height: 430px) and (orientation: landscape) {
        .vc-btn { width: 48px; height: 48px; }
        .vc-pad { width: 150px; height: 150px; }
        .vc-joy-knob { width: 40px; height: 40px; }
        .vc-dir { width: 30px; height: 30px; line-height: 30px; margin-left: -15px; margin-top: -15px; font-size: 18px; }
        .vc-actions { grid-template-columns: repeat(2, 58px); gap: 8px; }
        .vc-actions .vc-btn { width: 58px; height: 48px; font-size: 14px; }
        .vc-battle { top: max(10px, env(safe-area-inset-top)); bottom: auto; }
        .vc-battle .vc-btn { width: 50px; height: 36px; font-size: 12px; }
      }
    </style>
  </head>
  <body>
    <div id="gameFrame">
      <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    </div>

    <div id="utilityBar">
      <button id="btnDeleteData" onclick="clearData();">清除快取</button>
      <button id="btnDownloadSave" onclick="downloadSaves();">下載記錄</button>
    </div>

    <div id="audioControls" aria-label="音訊開關">
      <button id="btnToggleSceneInfo" class="audio-toggle off" onclick="toggleSceneInfo();" title="顯示場景資訊" aria-label="顯示場景資訊">📍</button>
      <button id="btnToggleSound" class="audio-toggle" onclick="toggleSoundMute();" title="禁用聲音" aria-label="禁用聲音">🔊</button>
      <button id="btnToggleVoice" class="audio-toggle" onclick="toggleVoiceMute();" title="禁用語音" aria-label="禁用語音">🗣️</button>
    </div>

    <div id="mobileControls" aria-label="虛擬按鍵">
      <div class="vc-pad" id="virtualJoystick" aria-label="八方向搖桿">
        <span class="vc-dir vc-dir-nw" data-joy-key="Home">↖</span>
        <span class="vc-dir vc-dir-n" data-joy-key="ArrowUp">↑</span>
        <span class="vc-dir vc-dir-ne" data-joy-key="PageUp">↗</span>
        <span class="vc-dir vc-dir-w" data-joy-key="ArrowLeft">←</span>
        <span class="vc-dir vc-dir-e" data-joy-key="ArrowRight">→</span>
        <span class="vc-dir vc-dir-sw" data-joy-key="End">↙</span>
        <span class="vc-dir vc-dir-s" data-joy-key="ArrowDown">↓</span>
        <span class="vc-dir vc-dir-se" data-joy-key="PageDown">↘</span>
        <span class="vc-joy-knob" id="virtualJoystickKnob"></span>
      </div>
      <div class="vc-actions">
        <button class="vc-btn" data-key="Enter">回車</button>
        <button class="vc-btn" data-key=" ">空格</button>
        <button class="vc-btn" data-key="Escape">ESC</button>
        <button class="vc-btn vc-party-switch" data-key="c">換人</button>
      </div>
      <div class="vc-battle">
        <button class="vc-btn" data-key="a">自動</button>
        <button class="vc-btn" data-key="g">合擊</button>
        <button class="vc-btn" data-key="d">防禦</button>
        <button class="vc-btn" data-key="e">物品</button>
        <button class="vc-btn" data-key="m">奇術</button>
        <button class="vc-btn" data-key="f">強制</button>
        <button class="vc-btn" data-key="q">逃跑</button>
        <button class="vc-btn" data-key="w">投擲</button>
        <button class="vc-btn" data-key="s">狀態</button>
        <button class="vc-btn" data-key="r" title="重複上輪" aria-label="重複上輪">重複</button>
      </div>
    </div>

    <div id="loadingScreen">
      <div class="loading-card">
        <img id="logo" src="icon.png" alt="SDLPAL">
        <h1>真·仙剑奇侠传 20260610.9</h1>
        <div class="subtitle">SDLPAL Web Edition</div>
        <div id="buildVersion">版本 20260610.9</div>
        <div class="tuning-panel" id="tuningPanel">
          <label class="tuning-setting"><span id="expLabelText">戰鬥經驗</span><input id="expMultiplier" type="range" min="1" max="50" step="1" value="5"><span class="tuning-value"><span id="expMultiplierValue">5</span> 倍</span></label>
          <label class="tuning-setting"><span id="cashLabelText">戰鬥金錢</span><input id="cashMultiplier" type="range" min="1" max="100" step="1" value="5"><span class="tuning-value"><span id="cashMultiplierValue">5</span> 倍</span></label>
          <label class="tuning-setting"><span id="speedLabelText">遊戲速度</span><input id="gameSpeed" type="range" min="1" max="5" step="1" value="1"><span class="tuning-value"><span id="gameSpeedValue">1</span> 倍</span></label>
        </div>
        <div class="spinner" id="spinner"></div>
        <div id="status">正在初始化...</div>
        <progress value="0" max="100" id="progress" hidden></progress>
        <button id="btnStartGame" onclick="launch();">開始遊戲</button>
        <div id="tips">首次进入会自動下载游戏资源。准备完成后点击“開始遊戲”，片头可按任意键跳过。</div>
      </div>
    </div>

    <script type="text/javascript" src="jszip.min.js"></script>
    <script type="text/javascript" src="main.js?v=20260610.9"></script>
    <script type="text/javascript" src="sdlpal.js?v=20260610.9"></script>

    <script type="text/javascript">
      var userLang = navigator.language || navigator.userLanguage;
      if (userLang === 'zh-TW' || userLang.startsWith('zh-Hant')) {
        document.getElementById('btnDeleteData').textContent = '清除快取';
        document.getElementById('btnDownloadSave').textContent = '下載記錄';
        document.getElementById('btnStartGame').textContent = '開始遊戲';
        document.getElementById('tips').textContent = '首次進入會自動下載遊戲資源。準備完成後點擊「開始遊戲」，片頭可按任意鍵跳過。';
        document.getElementById('expLabelText').textContent = '戰鬥經驗';
        document.getElementById('cashLabelText').textContent = '戰鬥金錢';
        document.getElementById('speedLabelText').textContent = '遊戲速度';
      } else if (!(userLang === 'zh-CN' || userLang.startsWith('zh-Hans'))) {
        document.getElementById('btnDeleteData').textContent = 'Clear cache';
        document.getElementById('btnDownloadSave').textContent = 'Download saves';
        document.getElementById('btnStartGame').textContent = 'Start Game';
        document.getElementById('tips').textContent = 'Game files download automatically on first launch. Click Start Game when ready. Press any key to skip intro videos.';
        document.getElementById('expLabelText').textContent = 'Battle EXP';
        document.getElementById('cashLabelText').textContent = 'Battle Money';
        document.getElementById('speedLabelText').textContent = 'Game Speed';
      }
    </script>
  </body>
</html>
